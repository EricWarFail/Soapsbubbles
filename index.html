<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Spark — Motivational Quotes</title>

  <!-- ============================================================
       STYLES
       ============================================================ -->
  <style>
    /* ---- Reset & base ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ---- CSS custom properties — light mode defaults ---- */
    :root {
      --surface:     #ffffffcc;
      --text-main:   #1a1a1a;
      --text-muted:  #555;
      --accent:      #6c63ff;
      --accent-dark: #5249d1;
      --shadow:      rgba(0,0,0,0.12);
      --radius:      1.25rem;
      --transition:  0.35s ease;
    }

    /* ---- Dark mode ---- */
    [data-theme="dark"] {
      --surface:     rgba(20,20,35,0.75);
      --text-main:   #f0f0f5;
      --text-muted:  #aaa;
      --accent:      #b8b3ff;
      --accent-dark: #9d97ff;
      --shadow:      rgba(0,0,0,0.45);
    }

    /* ---- Animated blob background ---- */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
    }

    /* ---- Layout ---- */
    html, body {
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1.5rem;
      position: relative;
      z-index: 1;
    }

    /* ---- Theme toggle (top-right) ---- */
    #theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--surface);
      border: none;
      border-radius: 50%;
      width: 2.5rem;
      height: 2.5rem;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 2px 8px var(--shadow);
      transition: background var(--transition), transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #theme-toggle:hover { transform: scale(1.1); }

    /* ---- Quote card ---- */
    .card {
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: var(--radius);
      box-shadow: 0 8px 32px var(--shadow);
      padding: 2.5rem 2rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
      transition: background var(--transition), box-shadow var(--transition);
      position: relative;
      z-index: 2;
    }

    /* ---- Quote text wrapper — handles fade transition ---- */
    #quote-wrapper {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #quote-wrapper.fade-out {
      opacity: 0;
      transform: translateY(8px);
    }

    /* ---- Opening quotation mark decoration ---- */
    .card::before {
      content: '\201C';
      display: block;
      font-size: 4rem;
      line-height: 1;
      color: var(--accent);
      margin-bottom: 0.25rem;
      font-family: Georgia, serif;
      opacity: 0.6;
    }

    #quote-text {
      font-size: clamp(1.15rem, 4vw, 1.45rem);
      line-height: 1.65;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 1.25rem;
    }

    #quote-author {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-style: italic;
      letter-spacing: 0.02em;
    }

    /* ---- Button row ---- */
    .btn-row {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 2rem;
    }

    button {
      border: none;
      border-radius: 2rem;
      padding: 0.65rem 1.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, opacity 0.2s;
    }
    button:active { transform: scale(0.96); }

    #new-quote-btn {
      background: var(--accent);
      color: #fff;
      min-width: 8rem;
    }
    #new-quote-btn:hover { background: var(--accent-dark); }
    #new-quote-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    #copy-btn {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
    }
    #copy-btn:hover { background: var(--accent); color: #fff; }

    /* ---- Copy feedback ---- */
    #copy-feedback {
      font-size: 0.8rem;
      color: var(--accent);
      min-height: 1rem;
      margin-top: 0.5rem;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #copy-feedback.show { opacity: 1; }

    /* ---- Footer ---- */
    footer {
      margin-top: 2.5rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-align: center;
    }
    footer span { opacity: 0.8; }

    footer {
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- Animated background -->
  <canvas id="bg-canvas"></canvas>

  <!-- Theme toggle -->
  <button id="theme-toggle" aria-label="Toggle dark/light mode">🌙</button>

  <!-- Quote card -->
  <main class="card" role="main">
    <div id="quote-wrapper">
      <p id="quote-text">Loading&hellip;</p>
      <p id="quote-author"></p>
    </div>

    <div class="btn-row">
      <button id="new-quote-btn">New Quote</button>
      <button id="copy-btn">Copy</button>
    </div>
    <p id="copy-feedback" aria-live="polite"></p>
  </main>

  <!-- Footer / branding -->
  <footer>
    <span>✦ Daily Spark — a little push, every day ✦</span>
  </footer>


  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->
  <script>
    'use strict';

    // ---- Local quote bank ----
    const LOCAL_QUOTES = [
      { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
      { text: "In the middle of every difficulty lies opportunity.", author: "Albert Einstein" },
      { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
      { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
      { text: "Everything you've ever wanted is on the other side of fear.", author: "George Addair" },
      { text: "Success is not final; failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
      { text: "Hardships often prepare ordinary people for an extraordinary destiny.", author: "C.S. Lewis" },
      { text: "You are never too old to set another goal or to dream a new dream.", author: "C.S. Lewis" },
      { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
      { text: "Act as if what you do makes a difference. It does.", author: "William James" },
      { text: "What you get by achieving your goals is not as important as what you become.", author: "Henry David Thoreau" },
      { text: "Spread love everywhere you go. Let no one ever come to you without leaving happier.", author: "Mother Teresa" },
      { text: "When you reach the end of your rope, tie a knot in it and hang on.", author: "Franklin D. Roosevelt" },
      { text: "Don't judge each day by the harvest you reap but by the seeds that you plant.", author: "Robert Louis Stevenson" },
      { text: "The best time to plant a tree was 20 years ago. The second best time is now.", author: "Chinese Proverb" },
      { text: "An unexamined life is not worth living.", author: "Socrates" },
      { text: "You miss 100% of the shots you don't take.", author: "Wayne Gretzky" },
      { text: "Whether you think you can or you think you can't, you're right.", author: "Henry Ford" },
      { text: "I have learned over the years that when one's mind is made up, this diminishes fear.", author: "Rosa Parks" },
      { text: "I am not a product of my circumstances. I am a product of my decisions.", author: "Stephen Covey" },
      { text: "Start where you are. Use what you have. Do what you can.", author: "Arthur Ashe" },
      { text: "Dream big and dare to fail.", author: "Norman Vaughan" },
      { text: "We may encounter many defeats but we must not be defeated.", author: "Maya Angelou" },
      { text: "Knowing is not enough; we must apply. Wishing is not enough; we must do.", author: "Johann Wolfgang von Goethe" },
      { text: "Imagine your life is perfect in every respect; what would it look like?", author: "Brian Tracy" },
      { text: "We generate fears while we sit. We overcome them by action.", author: "Dr. Henry Link" },
      { text: "Security is mostly a superstition. Life is either a daring adventure or nothing.", author: "Helen Keller" },
      { text: "The man who has confidence in himself gains the confidence of others.", author: "Hasidic Proverb" },
      { text: "Inaction breeds doubt and fear. Action breeds confidence and courage.", author: "Dale Carnegie" },
      { text: "How wonderful it is that nobody need wait a single moment before starting to improve the world.", author: "Anne Frank" },
      { text: "When I stand before God at the end of my life, I hope I have not a single bit of talent left.", author: "Erma Bombeck" },
      { text: "Few things can help an individual more than to place responsibility on him.", author: "Booker T. Washington" },
      { text: "Certain things catch your eye, but pursue only those that capture the heart.", author: "Ancient Indian Proverb" },
      { text: "Believe and act as if it were impossible to fail.", author: "Charles Kettering" },
      { text: "Do one thing every day that scares you.", author: "Eleanor Roosevelt" },
      { text: "What's money? A man is a success if he gets up in the morning and goes to bed at night and in between does what he wants to do.", author: "Bob Dylan" },
      { text: "I didn't fail the test. I just found 100 ways to do it wrong.", author: "Benjamin Franklin" },
      { text: "I have not failed. I've just found 10,000 ways that won't work.", author: "Thomas Edison" },
      { text: "The ones who are crazy enough to think they can change the world, are the ones that do.", author: "Steve Jobs" },
      { text: "Don't raise your voice, improve your argument.", author: "Desmond Tutu" },
      { text: "If you want to lift yourself up, lift up someone else.", author: "Booker T. Washington" },
      { text: "A person who never made a mistake never tried anything new.", author: "Albert Einstein" },
      { text: "Great minds discuss ideas; average minds discuss events; small minds discuss people.", author: "Eleanor Roosevelt" },
      { text: "It is never too late to be what you might have been.", author: "George Eliot" },
      { text: "You become what you believe.", author: "Oprah Winfrey" },
      { text: "I would rather die of passion than of boredom.", author: "Vincent van Gogh" },
      { text: "A truly rich man is one whose children run into his arms when his hands are empty.", author: "Unknown" },
      { text: "It is not what you do for your children, but what you have taught them to do for themselves.", author: "Ann Landers" },
      { text: "If you want your children to turn out well, spend twice as much time with them and half as much money.", author: "Abigail Van Buren" },
      { text: "Your time is limited, so don't waste it living someone else's life.", author: "Steve Jobs" },
      { text: "The two most important days in your life are the day you are born and the day you find out why.", author: "Mark Twain" },
    ];

    // ---- DOM refs ----
    const quoteWrapper  = document.getElementById('quote-wrapper');
    const quoteText     = document.getElementById('quote-text');
    const quoteAuthor   = document.getElementById('quote-author');
    const newQuoteBtn   = document.getElementById('new-quote-btn');
    const copyBtn       = document.getElementById('copy-btn');
    const copyFeedback  = document.getElementById('copy-feedback');
    const themeToggle   = document.getElementById('theme-toggle');

    // ---- Track last index so we never repeat back-to-back ----
    let lastIndex = -1;

    function getRandomLocal() {
      let idx;
      do { idx = Math.floor(Math.random() * LOCAL_QUOTES.length); }
      while (idx === lastIndex && LOCAL_QUOTES.length > 1);
      lastIndex = idx;
      return LOCAL_QUOTES[idx];
    }

    // ---- Render a quote with a fade transition ----
    function renderQuote({ text, author }) {
      quoteWrapper.classList.add('fade-out');

      setTimeout(() => {
        quoteText.textContent   = text;
        quoteAuthor.textContent = author ? `— ${author}` : '';
        quoteWrapper.classList.remove('fade-out');
      }, 320); // matches the CSS transition duration
    }

    // ---- Pick a new quote (local only; extend here for API) ----
    async function loadNewQuote() {
      newQuoteBtn.disabled = true;

      // Optional: swap getRandomLocal() for an API call and fall back on failure
      const quote = getRandomLocal();
      renderQuote(quote);

      // Re-enable after the animation completes
      setTimeout(() => { newQuoteBtn.disabled = false; }, 400);
    }

    // ---- Copy to clipboard ----
    async function copyQuote() {
      const full = `"${quoteText.textContent}" ${quoteAuthor.textContent}`.trim();
      try {
        await navigator.clipboard.writeText(full);
        showCopyFeedback('Copied!');
      } catch {
        // Fallback for browsers that block clipboard without HTTPS
        const ta = document.createElement('textarea');
        ta.value = full;
        ta.style.position = 'fixed';
        ta.style.opacity  = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showCopyFeedback('Copied!');
      }
    }

    function showCopyFeedback(msg) {
      copyFeedback.textContent = msg;
      copyFeedback.classList.add('show');
      setTimeout(() => copyFeedback.classList.remove('show'), 1800);
    }

    // ---- Dark / light mode ----
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', theme);
      window.dispatchEvent(new CustomEvent('themechange', { detail: theme }));
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    // ---- Blob background animation ----
    (function initBlobs() {
      const canvas = document.getElementById('bg-canvas');
      const ctx    = canvas.getContext('2d');

      const LIGHT_COLORS = ['#ff9de2','#ffb347','#ffe066','#8be8ff','#a0f0a0','#c77dff','#ff6b6b','#56cfe1'];
      const DARK_COLORS  = ['#7b2d8b','#1a4a8a','#0a6640','#8b3a1a','#4a1a8b','#1a6b6b','#8b1a4a','#2d5a1a'];

      let colors = LIGHT_COLORS;

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      // Each blob has a position, velocity, radius, and color
      const blobs = Array.from({ length: 7 }, (_, i) => ({
        x:    Math.random() * canvas.width,
        y:    Math.random() * canvas.height,
        vx:   (Math.random() - 0.5) * 0.9,
        vy:   (Math.random() - 0.5) * 0.9,
        r:    120 + Math.random() * 180,
        ci:   i % colors.length,
      }));

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Soft base fill
        ctx.fillStyle = document.documentElement.getAttribute('data-theme') === 'dark'
          ? '#0d0d1a' : '#f0eeff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        blobs.forEach(b => {
          const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
          grad.addColorStop(0, colors[b.ci] + 'cc');
          grad.addColorStop(1, colors[b.ci] + '00');
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();

          // Bounce off edges
          b.x += b.vx;
          b.y += b.vy;
          if (b.x < -b.r)             b.x = canvas.width  + b.r;
          if (b.x > canvas.width + b.r) b.x = -b.r;
          if (b.y < -b.r)             b.y = canvas.height + b.r;
          if (b.y > canvas.height + b.r) b.y = -b.r;
        });

        requestAnimationFrame(draw);
      }

      draw();

      // Update colors when theme changes
      window.addEventListener('themechange', e => {
        colors = e.detail === 'dark' ? DARK_COLORS : LIGHT_COLORS;
      });
    })();

    // ---- Init ----
    (function init() {
      // Restore saved theme or use system preference
      const saved  = localStorage.getItem('theme');
      const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      applyTheme(saved ?? system);

      // Show a random quote on load
      loadNewQuote();

      // Wire up buttons
      newQuoteBtn.addEventListener('click', loadNewQuote);
      copyBtn.addEventListener('click', copyQuote);
      themeToggle.addEventListener('click', toggleTheme);
    })();
  </script>
</body>
</html>
